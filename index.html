<!DOCTYPE html>

    <title>TravelBloom - Travel Recommendation</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <!-- NAVBAR -->

    <nav class="navbar">

        <div class="logo">

            <div class="logo-icon">
                ✈
            </div>

            <span>TravelBloom</span>

        </div>


        <div class="nav-links">

            <a href="travel_recommendation.html">
                Home
            </a>

            <a href="about.html">

            </a>

            <a href="contact.html">

            </a>

        </div>


        <div class="search-area">

                type="text"

            </button>

            </button>

    <!-- HOME -->

    <main class="hero">

            <a href="#">f</a>

        <section class="intro">

            <h1>
                EXPLORE DREAM
                <br>
                DESTINATION
            </h1>

            <p>
                Welcome to TravelBloom, your travel recommendation
                website. Explore beautiful destinations, discover
                amazing beaches and temples, and find countries that
                are perfect for your next journey.
            </p>

            <button class="book-btn">
                Book Now
            </button>

        <section id="resultsSection">
