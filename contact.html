<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TravelBloom - Contact Us</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <!-- NAVBAR -->

    <nav class="navbar">

        <div class="logo">

            <div class="logo-icon">
                ✈
            </div>

            <span>TravelBloom</span>

        </div>


        <div class="nav-links">

            <a href="travel_recommendation.html">
                Home
            </a>

            <a href="about.html">
                About Us
            </a>

            <a href="contact.html">
                Contact Us
            </a>

        </div>

    </nav>


    <!-- CONTACT PAGE -->

    <main class="contact-page">

        <!-- LEFT -->

        <section class="contact-info">

            <h1>
                CONTACT US
            </h1>

            <p>
                Get in touch with us
            </p>


            <div class="contact-details">

                <p>
                    📧 Email: travelbloom@example.com
                </p>

                <p>
                    📞 Phone: +92 300 1234567
                </p>

                <p>
                    📍 Location: Karachi, Pakistan
                </p>

            </div>

        </section>


        <!-- FORM -->

        <section class="contact-form">

            <form action="mailto:travelbloom@example.com"
                  method="post"
                  enctype="text/plain">

                <label for="name">
                    Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your name"
                    required
                >


                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >


                <label for="message">
                    Message
                </label>

                <textarea
                    id="message"
                    name="message"
                    placeholder="Enter your message"
                    required
                ></textarea>


                <button type="submit">
                    Submit
                </button>

            </form>

        </section>

    </main>

</body>

</html>
